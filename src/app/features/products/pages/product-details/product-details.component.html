<div class="product-details-container" *ngIf="product">
  <div class="product-image-container">
    <img class="product-image" [src]="product.image" [alt]="product.title">
  </div>
  
  <div class="product-info">
    <h1>{{ product.title }}</h1>
    <p class="category">{{ product.category }}</p>
    <p class="price">₪{{ product.price }}</p>
    <div class="rating">
      <span>דירוג: {{ product.rating.rate }} ({{ product.rating.count }} ביקורות)</span>
    </div>
    <p class="description">{{ product.description }}</p>
    
    <div class="actions">
      <button class="basic-button" (click)="addToCart($event)">
        <app-icon [name]="iconTypes.HEART" size="small"></app-icon>
        <span>הוסף לסל</span>
      </button>
      <button class="back-button" (click)="goBack()">חזרה למוצרים</button>
    </div>
  </div>
</div>

<div class="loading" *ngIf="loading">
  טוען פרטי מוצר...
</div>

<div class="error" *ngIf="error">
  {{ error }}
</div>
